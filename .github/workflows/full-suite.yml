name: full suite
# Every test in the repo, on every pull request, in the merge queue and on main.
# A draft pull request runs none: Dokima's are drafts until the merge gate readies them, after the code review (#597).
# Runs main's copy of this workflow, so a pull request can't rewrite its own judge; only the code it tests comes from
# the pull request, checked out with no token left behind, and the run holds no secret and only read access.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  all-tests:
    name: all tests
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      # The repo's Python, test tools and install command, from its settings file over Dokima's defaults (#794).
      # A checkout without Dokima's settings reader sets up as this workflow did before #794.
      - id: setup
        run: |
          if [ -f dokima/settings.py ]; then out=$(python3 -m dokima.settings setup)
          else out=$(printf 'python=3.12\ntest_tools=pytest pytest-xdist\ninstall=\n'); fi
          echo "$out"; echo "$out" >> "${GITHUB_OUTPUT:-/dev/null}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup.outputs.python }}
      - name: Install the test tools and the repo itself
        env:
          TOOLS: ${{ steps.setup.outputs.test_tools }}
          INSTALL: ${{ steps.setup.outputs.install }}
        run: |
          pip install -q $TOOLS pyyaml
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
      # Every test, spread over all the runner's cores.
      - run: pytest -q -p no:cacheprovider -n auto tests

name: full suite
# The tests a pull request can affect (testmon, from main's baseline) on the pull request, and every test, spread
# over the runner's cores, once in the merge queue. Main is not run again: the queue already tested that exact merge.
# A repo with no merge queue (merge.queue false) runs every test on the pull request instead, its only run.
# A draft pull request runs none: Dokima's are drafts until the merge gate readies them, after the code review (#597).
# Runs main's copy of this workflow, so a pull request can't rewrite its own judge; only the code it tests comes from
# the pull request, checked out with no token left behind, and the run holds no secret and only read access.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
jobs:
  all-tests:
    name: all tests
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      # The repo's Python, test tools and install command, from its settings file over Dokima's defaults (#794).
      # A checkout whose settings reader has no setup mode (main before #794) sets up as this workflow did before.
      - id: setup
        run: |
          if python3 -c 'from dokima.settings import setup_lines' 2>/dev/null; then out=$(python3 -m dokima.settings setup)
          else out=$(printf 'python=3.12\ntest_tools=pytest pytest-xdist\ninstall=\n')
            echo "::notice title=Old setup::No settings reader with a setup mode here, so the old install list is used."; fi
          echo "$out"; echo "$out" >> "${GITHUB_OUTPUT:-/dev/null}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup.outputs.python }}
      - name: Install the test tools and the repo itself
        env:
          TOOLS: ${{ steps.setup.outputs.test_tools }}
          INSTALL: ${{ steps.setup.outputs.install }}
        run: |
          pip install -q $TOOLS pyyaml
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
      # Pull request on a repo with a merge queue: only the tests the change can affect, against main's newest testmon
      # baseline (testmon.yml), as the code review runs them. Everything else runs the all-tests command below.
      - id: mode
        run: |
          queue=true; affected=testmon
          if python3 -c 'from dokima.settings import read' 2>/dev/null; then
            queue=$(python3 -c 'from dokima.settings import read; print("false" if (read().get("merge") or {}).get("queue", True) is False else "true")')
            affected=$(python3 -c 'from dokima.settings import read; print((read().get("tests") or {}).get("affected") or "testmon")')
          fi
          mode=all
          if [ "${{ github.event_name }}" = pull_request_target ] && [ "$queue" = true ] && [ "$affected" != all ]; then mode=affected; fi
          echo "mode=$mode" >> "${GITHUB_OUTPUT:-/dev/null}"; echo "Tests to run: $mode (merge queue: $queue, affected tests: $affected)"
      - name: Restore main's testmon baseline
        if: steps.mode.outputs.mode == 'affected'
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ github.sha }}
          restore-keys: testmon-
      # The all-tests command from the settings, leaving out the tests on their exclude list (#795); by default every
      # test, spread over all the runner's cores. A checkout with no settings reader with an env mode (before #795)
      # runs that default as before. In affected mode testmon picks the tests; with no baseline, or one it cannot
      # read, every test runs.
      - name: Run the tests, as the settings say
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          out=; if python3 -c 'from dokima.settings import env_lines' 2>/dev/null; then out=$(python3 -m dokima.settings env); fi
          RUN_ALL=$(printf '%s\n' "$out" | sed -n 's/^TESTS_RUN_ALL=//p')
          if [ -z "$RUN_ALL" ]; then RUN_ALL="pytest -q -p no:cacheprovider -n auto tests"
            echo "::notice title=Old settings::No settings reader with an env mode here, so every test runs."; fi
          if [ "$MODE" = affected ] && [ -f .testmondata ]; then
            skip=$(python3 -c 'import shlex; from dokima.settings import read; print(" ".join("--deselect " + shlex.quote(str(t)) for t in (read().get("tests") or {}).get("exclude") or []))')
            # Pick only: main's baseline already maps tests to code, so nothing is recorded here (recording doubles
            # the run), and the picked tests spread over the runner's cores when the repo has pytest-xdist.
            par=; python3 -c 'import xdist' 2>/dev/null && par="-n auto"
            code=0; eval "python3 -m pytest -q --testmon-nocollect $par $skip" || code=$?
            # 0 passed, 1 a test failed, 5 no test affected: testmon's real answers. Anything else: run every test.
            if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
            if [ "$code" -eq 1 ]; then exit 1; fi
            echo "::warning title=No usable baseline::testmon stopped with exit $code; running every test"
          elif [ "$MODE" = affected ]; then
            echo "::notice title=No baseline::No testmon baseline from main was restored, so every test runs."
          fi
          eval "$RUN_ALL"

name: assign
# Assigns every new issue to the repo's code owners, so it shows up in their
# GitHub. Bot-opened issues too: no bot filter here. Names come from CODEOWNERS.
on:
  issues:
    types: [opened]
  # Called by the one workflow an adopter installs (dokima/install/dokima.yml), through entry.yml (#812).
  workflow_call:
    secrets:
      DOKIMA_APP_KEY: {required: true}
permissions:
  contents: read
  issues: write
jobs:
  assign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Assign the code owners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" -R "$REPO" --add-assignee "$(python3 -m dokima.plan approvers)"
  upstream:
    # A failed job files its failure in the upstream repo the settings name, naming this workflow and the job, with a
    # key the App's own key mints for that repo's owner; with none set, nothing is filed (#745).
    needs: [assign]
    if: failure()
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .dokima
          persist-credentials: false
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Name the upstream repo's owner
        id: upstream-owner
        run: echo "owner=$(python3 -m dokima.upstream owner)" >> "$GITHUB_OUTPUT"
      - id: upstream-key
        if: steps.upstream-owner.outputs.owner != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          owner: ${{ steps.upstream-owner.outputs.owner }}
      - name: File each failed job upstream
        if: success() || failure()
        env:
          RESULTS: "assign=${{ needs.assign.result }}"
          DOKIMA_UPSTREAM_TOKEN: ${{ steps.upstream-key.outputs.token }}
        run: python3 -m dokima.upstream failed assign

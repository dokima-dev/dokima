name: board
# Puts every card in the column and pill its issue's state on GitHub gives now, on
# every event about an issue or its pull request and every 15 minutes (only what
# changed since the last sweep that succeeded); keeps its Priority Blocker on open
# issues that block an open issue (from blocked-by links, read on close, reopen and
# every 15 minutes, since GitHub sends no event for a link); no label sets priority.
# Every merge sweeps every card.
# An issue and its pull requests share one queue, so the newest recompute waits for the
# running one and is never cancelled, while other issues' runs go on beside it.
# An event that cannot change a card's column or pill (a comment that is no command,
# record, run card or Autopilot line, a review or line note with no command, new
# commits, finished checks, another label, an edit leaving the owner's ask as it was)
# skips the update; every other waits a minute in its issue's own queue, where a newer
# one cancels it, so a burst becomes one update (#533).
# Rules live in dokima/board.py. Does nothing unless the repo variable DOKIMA_BOARD
# names a board ("org/number").
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "*/15 * * * *"
  issue_comment:
    types: [created]
  # pull_request_target runs main's copy of this file, so the keys environment opens;
  # this job only checks out main's code, never the PR's.
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  # A review or line note would run the pull request's own copy of this file, so
  # they reach it through reviews.yml, which holds no key; this runs after it.
  workflow_run:
    workflows: [Acceptance criteria, reviews]
    types: [completed]
permissions:
  contents: read
jobs:
  queue:
    if: vars.DOKIMA_BOARD != ''
    runs-on: ubuntu-24.04
    outputs:
      group: ${{ steps.queue.outputs.group }}
      run: ${{ steps.queue.outputs.run }}
      wait: ${{ steps.queue.outputs.wait }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - id: queue
        run: python3 -m dokima.board queue
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  # Only the wait is cancelled by a newer event about the issue, never a running sync.
  # Autopilot leaves a cancelled board wait out of a head's checks (agent.BOARD_WAIT).
  settle:
    name: board wait
    needs: queue
    concurrency:
      group: ${{ needs.queue.outputs.wait }}
      cancel-in-progress: true
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 60
  sync:
    needs: [queue, settle]
    concurrency:
      group: ${{ needs.queue.outputs.group }}
      cancel-in-progress: false
    environment: keys
    if: vars.DOKIMA_BOARD != '' && needs.queue.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Sync the board
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: python3 -m dokima.board
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true

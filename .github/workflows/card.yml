name: card
# Writes the card at the top of the issue and its PR on every change to either: an edit, a label, a comment, a
# review or line note (heard through reviews.yml), a push, a close, a run starting or ending, the bot's own changes
# included. A redraw the bot started that finds both cards current writes nothing, so its own card save ends the
# chain. The cards of the issues it blocks or is blocked by follow when their links changed. GitHub announces no
# event for a blocked-by link added or removed by hand, so a run every 15 minutes catches up the cards whose links
# changed.
# These triggers always use the default branch's copy of this file and of dokima/card.py, so the work being judged
# cannot change how it is reported.
# An issue and its pull request share one queue, so the newest redraw waits for the
# running one and is never cancelled, while other issues' redraws and the sweep go
# on beside it.
on:
  workflow_run:
    workflows: [Acceptance criteria, full suite, worker, reviews]
    types: [in_progress, completed]
  issues:
  issue_comment:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read
jobs:
  queue:
    # Every change redraws; an issue deleted or moved away has no card left to draw.
    if: github.event_name != 'issues' || (github.event.action != 'deleted' && github.event.action != 'transferred')
    runs-on: ubuntu-24.04
    outputs:
      group: ${{ steps.queue.outputs.group }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      # The issue this event is about, from the issue, the pull request's branch or the worker run's title.
      - id: queue
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          ON_PR: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          RUN: ${{ github.run_id }}
        run: |
          # A comment on a pull request waits in its issue's queue, found from the pull request's branch.
          if [ -n "$ON_PR" ]; then
            PR="$ON_PR"; HEAD=$(gh api "repos/$REPO/pulls/$ON_PR" --jq .head.ref)
          fi
          if [ "$EVENT" = schedule ]; then group=card-sweep
          elif [ -n "$ISSUE" ]; then group="card-$ISSUE"
          elif [[ "$TITLE" =~ ^worker\ for\ \#([0-9]+)$ ]]; then group="card-${BASH_REMATCH[1]}"
          elif [[ "$HEAD" =~ ^(try|work)/issue-([0-9]+)$ ]]; then group="card-${BASH_REMATCH[2]}"
          elif [ -n "$PR" ]; then group="card-pr-$PR"
          else group="card-run-$RUN"
          fi
          echo "group=$group" >> "$GITHUB_OUTPUT"
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  card:
    needs: queue
    concurrency:
      group: ${{ needs.queue.outputs.group }}
      cancel-in-progress: false
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
      # The card is posted by the repo's Dokima app, so it shows as that app's bot.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Write the card
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ON_PR: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          BY_BOT: ${{ github.event.sender.type == 'Bot' }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: python3 dokima/card.py
      # The PR's description carries no Closes line (#416), so a merge closes the issue it was built for here.
      - name: Close the issue a merged pull request was built for
        if: github.event_name == 'pull_request_target' && github.event.pull_request.merged
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD" =~ ^(try|work)/issue-([0-9]+)$ ]]; then
            gh issue close "${BASH_REMATCH[2]}" -R "$GITHUB_REPOSITORY" --reason completed \
              --comment "Closed: pull request #$PR merged." || echo "::warning title=Issue not closed::#${BASH_REMATCH[2]}"
          fi
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true

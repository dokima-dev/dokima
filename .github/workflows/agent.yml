name: agent
run-name: "${{ (inputs.role || github.event.client_payload.role) }}${{ (inputs.role || github.event.client_payload.role) == 'reviewer' && format(' ({0})', (inputs.stage || github.event.client_payload.stage)) || '' }} for #${{ (inputs.issue || github.event.client_payload.issue) }}"
# Runs one agent on a fresh GitHub machine. Started by hand here, or by commands.yml when a code owner's comment
# starts with /plan, /work or /review. Code gathers everything the agent needs: the issue and its PR as one
# conversation (comments, reviews, line notes) and every earlier agent record, from its record file. The agent runs its own check before it
# finishes; code runs it again, then edits this run's live card (up since the code-owner gate) into its record: a card
# on top, the full JSON folded below.
# Those comments are what the cards are built from; each record is also saved as its own file on the logs branch,
# and starting packs read records only from those files (#610). Session logs stay on the run page.
# The river: after posting, code decides what follows (next_step in dokima/agent.py) and, when the next stage is an
# agent's, the bot sends a dokima-next signal that starts it here. On autopilot an approved plan starts the worker and
# an approved split is filed here, each with one Autopilot line on the issue. Otherwise the card mentions the owner and stops.
# Every step before the agent that fails writes why to /tmp/why.txt; when no agent started, the record says that instead.
on:
  repository_dispatch:
    types: [dokima-next]
  workflow_call:
    secrets:
      DOKIMA_APP_KEY: {required: true}
      # The agent keys the settings can name: Claude Code's, and one each for the other shipped agents.
      CLAUDE_CODE_OAUTH_TOKEN: {required: false}
      CODEX_API_KEY: {required: false}
      KIMI_API_KEY: {required: false}
    inputs:
      role: {type: string, required: true}
      stage: {type: string, default: plan}
      issue: {type: string, required: true}
      # The id of the run's queued card, put up by the listener; the run updates it instead of putting up its own.
      card: {type: string, default: ''}
  workflow_dispatch:
    inputs:
      role:
        description: Which agent
        type: choice
        options: [planner, reviewer, worker]
      stage:
        description: For the reviewer, what it grades
        type: choice
        options: [plan, pr]
        default: plan
      issue:
        description: Issue number
        required: true
concurrency:
  group: agent-${{ (inputs.issue || github.event.client_payload.issue) }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  run:
    environment: keys
    runs-on: ubuntu-24.04
    env:
      N: ${{ (inputs.issue || github.event.client_payload.issue) }}
      ROLE: ${{ (inputs.role || github.event.client_payload.role) }}
      STAGE: ${{ (inputs.role || github.event.client_payload.role) == 'reviewer' && (inputs.stage || github.event.client_payload.stage) || '' }}
      PACK: /tmp/pack
      # Dokima's own code and prompts come from Dokima's own repo, never from the repo or the branch being judged.
      PYTHONPATH: /tmp/runtime
      PYTHONSAFEPATH: "1"
      OUT: /tmp/dokima-out
      # Main's settings file, copied with the runtime: its agents section names each role's agent, model and key
      # secret (#698, #794); a repo with only the old agents file beside it still runs as that file says.
      DOKIMA_SETTINGS: /tmp/runtime/.dokima/settings.yaml
      # A card already up for this run: queued by the listener, or by the hand-off that started it.
      CARD_ID: ${{ (inputs.card || github.event.client_payload.card) }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dokima's code comes from Dokima's own repo, at the commit of this shared workflow (main when run directly),
      # never from the repo it works on (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Copy the runtime from main before touching any branch
        # Main's test commands, test folder, branches, bot, co-author and owner docs file, over Dokima's defaults, for
        # every later step (#795, #796); a settings reader with no env mode (before #795) gives Dokima's own.
        # The owner docs file the settings name (AGENTS.md by default) and the topic files it links come too: the river
        # checks the owner's words a plan reviewer quotes from them. So do main's house rules files (#796).
        run: |
          # Dokima's code from its checkout, moved out of the repo so no commit picks it up; the repo's own copy never runs.
          [ -d .dokima-code/dokima ] || { echo "Dokima's code was not checked out from dokima-dev/dokima." > /tmp/why.txt
                                          echo "::error title=No Dokima code::$(cat /tmp/why.txt)"; exit 1; }
          mkdir -p /tmp/runtime && mv .dokima-code/dokima /tmp/runtime/dokima && rm -rf .dokima-code
          for f in settings.yaml agents.yml; do
            if [ -f ".dokima/$f" ]; then mkdir -p /tmp/runtime/.dokima && cp ".dokima/$f" /tmp/runtime/.dokima/; fi
          done
          (cd /tmp/runtime && python3 -m dokima.settings env) > /tmp/env.txt 2> /tmp/env-err.txt \
            || { echo "The settings file stopped the run: $(paste -sd' ' /tmp/env-err.txt)" > /tmp/why.txt
                 echo "::error title=Bad settings::$(cat /tmp/why.txt)"; exit 1; }
          cat /tmp/env-err.txt >&2
          if ! grep -q '^DEFAULT_BRANCH=' /tmp/env.txt; then
            echo "::notice title=Old settings::No settings reader with an env mode here, so Dokima's own branches and bot are used."
            printf 'TESTS_AFFECTED=testmon\nTESTS_DIR=tests\nDEFAULT_BRANCH=main\nRECORDS_BRANCH=logs\nBOT_SLUG=dokima-runtime\n' > /tmp/env.txt
          fi
          cat /tmp/env.txt >> "$GITHUB_ENV"
          DOCS=$(sed -n 's/^OWNER_DOCS=//p' /tmp/env.txt); DOCS=${DOCS:-AGENTS.md}
          case "$DOCS" in /*|*..*) echo "::warning title=Owner docs not copied::$DOCS is outside the repo"; DOCS= ;; esac
          if [ -n "$DOCS" ] && [ -f "$DOCS" ]; then
            cp --parents "$DOCS" /tmp/runtime/
            DIR=$(dirname "$DOCS")
            grep -oE '\]\([^)#: ]+\.md' "$DOCS" | cut -c3- | sort -u | while read -r f; do
              case "$f" in /*|*..*) continue ;; esac
              [ "$DIR" = . ] || f="$DIR/$f"
              if [ -f "$f" ]; then cp --parents "$f" /tmp/runtime/; fi
            done
          elif [ -n "$DOCS" ]; then
            echo "::warning title=Owner docs not found::$DOCS, the owner docs file the settings name, is not on main"
          fi
          if (cd /tmp/runtime && python3 -c 'import dokima.prompt') 2>/dev/null; then
            (cd /tmp/runtime && python3 -m dokima.prompt files) | while read -r f; do
              case "$f" in ""|/*|*..*) continue ;; esac
              if [ -f "$f" ]; then cp --parents "$f" /tmp/runtime/; fi
            done
          fi
      # The bot is the repo's Dokima app: its id a repo variable and its key a repo secret; secrets kept only in an
      # environment never reach a shared workflow's jobs (#884).
      - name: The bot is set up
        env:
          APP_ID: ${{ vars.DOKIMA_APP_ID }}
          HAS_APP_KEY: ${{ secrets.DOKIMA_APP_KEY != '' }}
        run: |
          [ -n "$APP_ID" ] && [ "$HAS_APP_KEY" = true ] && exit 0
          echo "No bot is set up: add the app's id as the variable DOKIMA_APP_ID and its private key as the repo secret DOKIMA_APP_KEY (Settings, Secrets and variables, Actions), not only in an environment, which never reaches these jobs." > /tmp/why.txt
          echo "::error title=No bot::$(cat /tmp/why.txt)"; exit 1
      - name: Only a code owner starts an agent
        env:
          SENDER: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          # The river's own signal comes from the bot the settings name; everything else needs a code owner.
          [ "$EVENT" = repository_dispatch ] && [ "$SENDER" = "${BOT_SLUG}[bot]" ] && exit 0
          python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER" \
            || { echo "$SENDER is not a code owner, so they cannot start an agent." > /tmp/why.txt
                 echo "::error title=Not started::$(cat /tmp/why.txt)"; exit 1; }
      - name: The role's agent, model and key from the settings file
        # A role naming an unknown subscription or agent, or no model, stops here, before any agent starts.
        run: |
          { M=$(python3 -m dokima.agents model "$ROLE") && K=$(python3 -m dokima.agents key "$ROLE"); } 2> /tmp/agents-err.txt \
            || { echo "The settings file stopped the run: $(paste -sd' ' /tmp/agents-err.txt)" > /tmp/why.txt
                 echo "::error title=Bad settings::$(cat /tmp/why.txt)"; exit 1; }
          echo "MODEL=$M" >> "$GITHUB_ENV"; echo "AGENT_KEY=$K" >> "$GITHUB_ENV"
      - name: The role's key secret is set
        env:
          HAS_KEY: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] != '' }}
        run: |
          [ "$HAS_KEY" = true ] && exit 0
          echo "The secret ${AGENT_KEY:-CLAUDE_CODE_OAUTH_TOKEN}, which holds the $ROLE's model key, is missing: add it as a repo secret (Settings, Secrets and variables, Actions), not only in an environment, which never reaches these jobs." > /tmp/why.txt
          echo "::error title=No model key::$(cat /tmp/why.txt)"; exit 1
      # The run's card moves through its stages (queued, setting up, agent working, checking, then its record), each
      # written by this job's own steps, each with a key made for that one call and revoked at once: no bot key stays
      # live on this machine while the branch's code, its tests, the agent or the hand-back check run. Every stage
      # passes through scrub() with the run's secrets first. A card that cannot be shown never stops the run.
      # A card already up (the listener's or the hand-off's) is this run's queued card; otherwise it goes up now.
      - id: card-key
        if: env.CARD_ID == ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: Put up the run's card, queued
        if: env.CARD_ID == ''
        env:
          GH_TOKEN: ${{ steps.card-key.outputs.token }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          # Where the record will go: the PR once there is one, for the worker and the PR reviewer.
          PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head "try/issue-$N" --state open --json number -q '.[0].number' || true)
          WHERE=$N; if [ -n "$PR" ] && { [ "$ROLE" = worker ] || [ "$STAGE" = pr ]; }; then WHERE=$PR; fi
          python3 -m dokima.agent card "$ROLE" "$STAGE" queued > /tmp/card.md
          if ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$WHERE/comments" -F body=@/tmp/card.md --jq .id); then
            echo "CARD_ID=$ID" >> "$GITHUB_ENV"
          else
            echo "::warning title=No live card::the card could not be put up; the record is posted at the end"
          fi
          gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the card's key could not be revoked"
      - id: setup-key
        if: env.CARD_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: The card says setting up
        if: env.CARD_ID != ''
        env:
          GH_TOKEN: ${{ steps.setup-key.outputs.token }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          python3 -m dokima.agent card "$ROLE" "$STAGE" setting-up > /tmp/card.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -F body=@/tmp/card.md --silent \
            || echo "::warning title=Card not updated::the card could not say setting up"
          gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the card's key could not be revoked"
      # Git asks origin with the app's key, as the push does: on a private repo an anonymous ask fails (#914). The key
      # is made for this one step and revoked when it ends, before the branch's code or the agent run.
      - id: start-key
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: Starting branch
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_TOKEN: ${{ steps.start-key.outputs.token }}
        run: |
          [ -n "$ORIGIN_TOKEN" ] || { echo "No key to read the repo with: the app's key could not be made." > /tmp/why.txt
                                      echo "::error title=No key::$(cat /tmp/why.txt)"; exit 1; }
          trap 'GH_TOKEN="$ORIGIN_TOKEN" gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the starting key could not be revoked"' EXIT
          R="https://x-access-token:${ORIGIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          said() { paste -sd' ' /tmp/git-err.txt | sed "s#${ORIGIN_TOKEN}#***#g"; }
          git fetch -q "$R" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" 2> /tmp/git-err.txt \
            || { echo "Main could not be fetched: $(said)" > /tmp/why.txt
                 echo "::error title=Fetch failed::$(cat /tmp/why.txt)"; exit 1; }
          # Merges of the default branch commit as the bot the settings name.
          SLUG="$BOT_SLUG"
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id) \
            || { echo "The bot ${SLUG}[bot] the settings name was not found on GitHub." > /tmp/why.txt
                 echo "::error title=Bot not found::$(cat /tmp/why.txt)"; exit 1; }
          # Each merge commit credits the co-author the settings name; {bot}, the default, is the bot itself (#812).
          CO="${CO_AUTHOR//"{bot}"/${SLUG}[bot] <${BOT_ID}+${SLUG}[bot]@users.noreply.github.com>}"
          CREDIT=(); [ -z "$CO" ] || CREDIT=(--trailer "Co-authored-by: $CO")
          credit_merge() {
            [ -n "$CO" ] && [ "$(git rev-parse HEAD)" != "$BRANCH_TIP" ] && git rev-parse -q --verify HEAD^2 >/dev/null || return 0
            git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" commit -q --amend --no-edit "${CREDIT[@]}"
          }
          # An issue labeled hotfix is built from its text with no plan until a planner runs on it (#863).
          if { [ "$ROLE" = worker ] || [ "$STAGE" = pr ]; } && python3 -m dokima.hotfix labeled "$N"; then
            HOTFIX_LABEL=true; echo "HOTFIX_LABEL=true" >> "$GITHUB_ENV"
          fi
          # Exit 2 is git's "no such branch"; any other failure is a question origin could not answer, so the run stops.
          rc=0; git ls-remote --exit-code --heads "$R" "try/issue-$N" > /dev/null 2> /tmp/git-err.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then
            echo "Could not ask whether try/issue-$N exists: $(said)" > /tmp/why.txt
            echo "::error title=Branch unknown::$(cat /tmp/why.txt)"; exit 1
          fi
          if [ "$rc" = 0 ]; then
            git fetch -q "$R" "try/issue-$N" 2> /tmp/git-err.txt \
              || { echo "try/issue-$N could not be fetched: $(said)" > /tmp/why.txt
                   echo "::error title=Fetch failed::$(cat /tmp/why.txt)"; exit 1; }
            git checkout -q -B "try/issue-$N" FETCH_HEAD
            BRANCH_TIP=$(git rev-parse HEAD); echo "BRANCH_TIP=$BRANCH_TIP" >> "$GITHUB_ENV"
            # A worker's branch that clashes with main still starts: the merge is committed with its conflict markers,
            # the clashed files are listed for the fence, and the worker resolves them. Main's changes are in BASE.
            if [ "$ROLE" = worker ] && ! git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" merge -q --no-edit "origin/$DEFAULT_BRANCH"; then
              git diff --name-only --diff-filter=U > /tmp/clashed.txt
              if [ ! -s /tmp/clashed.txt ]; then
                echo "Merging main into try/issue-$N failed with no clashed file to resolve." > /tmp/why.txt
                echo "::error title=Merge failed::$(cat /tmp/why.txt)"; exit 1
              fi
              # A test the planner changed after taking main's version of it keeps the planner's change, and so does
              # a test whose clash with main's version the planner was handed and resolved, with no marker left (#662).
              MB=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
              for f in $(cat /tmp/clashed.txt); do
                case "$f" in "${TESTS_DIR%/}"/*) ;; *) continue ;; esac
                MAINS=$(git rev-parse -q --verify "origin/$DEFAULT_BRANCH:$f" || true)
                if [ -n "$MAINS" ] && { git log --format="%H:$f" "$MB..HEAD" -- "$f" | git cat-file --batch-check='%(objectname)' | grep -qxF "$MAINS" \
                     || { git log --format=%B "$MB..HEAD" | grep -qxF "Clash-with-main: $f $MAINS" \
                          && ! git show "HEAD:$f" | grep -qE '^(<<<<<<<|=======|>>>>>>>)( |$)'; }; }; then
                  git checkout -q --ours -- "$f" && git add -- "$f"
                fi
              done
              git diff --name-only --diff-filter=U > /tmp/clashed.txt
              git add -A && git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" commit -q --no-edit "${CREDIT[@]}"
              [ ! -s /tmp/clashed.txt ] || echo "::notice title=Clash with main::the worker resolves $(paste -sd, /tmp/clashed.txt)"
            fi
            [ "$ROLE" != worker ] || credit_merge
            # A planner starts with main merged in, so it sees and can change the tests main added (#475). A branch
            # that clashes with main stays unmerged for the worker; it takes only main's tests the branch never
            # touched, and its plan check's base holds every test main changed, so none counts as the plan's own
            # unless the branch's copy differs from main's, even after an earlier round took it. A test both sides
            # changed is handed to the planner with its clash marked, to resolve (#662); the commit names main's copy
            # it clashed with, so the worker's merge keeps the planner's resolution instead of handing it the clash.
            if [ "$ROLE" = planner ] && ! git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" merge -q --no-edit "origin/$DEFAULT_BRANCH"; then
              git reset -q --merge
              MB=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
              git diff --name-only "$MB" "origin/$DEFAULT_BRANCH" -- "$TESTS_DIR" > /tmp/mains-tests.txt
              : > /tmp/mains-index.txt
              while read -r f; do
                if git cat-file -e "origin/$DEFAULT_BRANCH:$f" 2>/dev/null; then
                  ! git diff --quiet "$MB" HEAD -- "$f" || git checkout -q "origin/$DEFAULT_BRANCH" -- "$f"
                  git ls-tree "origin/$DEFAULT_BRANCH" -- "$f" >> /tmp/mains-index.txt
                else
                  ! git diff --quiet "$MB" HEAD -- "$f" || git rm -q -- "$f"
                  printf '0 0000000000000000000000000000000000000000\t%s\n' "$f" >> /tmp/mains-index.txt
                fi
              done < /tmp/mains-tests.txt
              : > /tmp/clash-trailers.txt
              while read -r f; do
                MAINS=$(git rev-parse -q --verify "origin/$DEFAULT_BRANCH:$f" || true)
                if [ -n "$MAINS" ] && git cat-file -e "HEAD:$f" 2>/dev/null && ! git diff --quiet "$MB" HEAD -- "$f" \
                   && ! git log --format=%B "$MB..HEAD" | grep -qxF "Clash-with-main: $f $MAINS"; then
                  git show "$MB:$f" > /tmp/base-side 2>/dev/null || : > /tmp/base-side
                  git show "$MAINS" > /tmp/mains-side
                  rc=0; git merge-file -p -L "try/issue-$N" -L "where it split off" -L "origin/$DEFAULT_BRANCH" "$f" /tmp/base-side /tmp/mains-side > /tmp/merged-side || rc=$?
                  if [ "$rc" -gt 0 ] && [ "$rc" -lt 128 ]; then
                    cp /tmp/merged-side "$f"
                    echo "Clash-with-main: $f $MAINS" >> /tmp/clash-trailers.txt
                  fi
                fi
              done < /tmp/mains-tests.txt
              if ! git diff --cached --quiet || [ -s /tmp/clash-trailers.txt ]; then
                { echo "Main's tests for the planner of #$N"; [ ! -s /tmp/clash-trailers.txt ] || { echo; cat /tmp/clash-trailers.txt; }; } > /tmp/mains-msg.txt
                git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" commit -q --allow-empty -F /tmp/mains-msg.txt "${CREDIT[@]}"
              fi
              BASE_TREE=$(export GIT_INDEX_FILE=/tmp/base.index; git read-tree "$MB" && git update-index --index-info < /tmp/mains-index.txt && git write-tree)
              MAINS_BASE=$(git -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" commit-tree "$BASE_TREE" -p "$MB" -m "Where #$N split off main, with main's tests")
              echo "::notice title=Clash with main::the planner starts with main's tests; the worker merges main"
            fi
            [ "$ROLE" != planner ] || credit_merge
          elif [ "$ROLE" = planner ] || [ "$STAGE" = plan ]; then
            # A plan review needs no branch: a split never makes one, so it reviews from main.
            git checkout -q -B "try/issue-$N" "origin/$DEFAULT_BRANCH"
          elif [ "$ROLE" = worker ] && [ "${HOTFIX_LABEL:-}" = true ]; then
            # A hotfix is built from its text with no plan, so its worker starts the branch from main (#863).
            git checkout -q -B "try/issue-$N" "origin/$DEFAULT_BRANCH"
          else
            echo "try/issue-$N does not exist; run the planner first." > /tmp/why.txt
            echo "::error title=Nothing to $ROLE::$(cat /tmp/why.txt)"; exit 1
          fi
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # A plan's tests are everything the issue's branch added since it split off main, over every planning round.
          echo "PLANNER_BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")" >> "$GITHUB_ENV"
          # A planner on a branch that clashes with main counts main's tests it took as already there.
          [ -z "${MAINS_BASE:-}" ] || echo "PLANNER_BASE=$MAINS_BASE" >> "$GITHUB_ENV"
          # What this run starts from: the planner may change only tests from here on.
          echo "PLANNER_RUN_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          LOG="logs/$N/${{ github.run_id }}-$ROLE${STAGE:+-$STAGE}.md"
          echo "LOG=$LOG" >> "$GITHUB_ENV"
          echo "LOG_URL=${{ github.server_url }}/${{ github.repository }}/blob/$RECORDS_BRANCH/$LOG" >> "$GITHUB_ENV"
      - name: Build the starting pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OWNERS=$(python3 -m dokima.plan approvers)
          python3 -m dokima.agent pack "$N" "$ROLE" "$STAGE" "$PACK" 2> /tmp/pack-err.txt || {
            if [ $? = 3 ]; then
              echo "No passed plan on the issue yet, or (for the worker) no plan review approving the newest plan." > /tmp/why.txt
            else
              echo "Building the starting pack failed: $(tail -1 /tmp/pack-err.txt)" > /tmp/why.txt
            fi
            cat /tmp/pack-err.txt >&2; echo "::error title=No pack::$(cat /tmp/why.txt)"; exit 1; }
          if [ "$STAGE" = pr ]; then git diff "origin/$DEFAULT_BRANCH...HEAD" > "$PACK/diff.patch"; fi
          # A hotfix's pack holds its ask in place of a plan (#863): the later steps judge it with no plan.
          if [ -f "$PACK/ask.md" ] && [ ! -f "$PACK/plan.json" ]; then echo "HOTFIX=true" >> "$GITHUB_ENV"; fi
          ls -R "$PACK" | head -60
      # The repo's Python, test tools and install command, from main's settings file over Dokima's defaults (#794).
      # A runtime whose settings reader has no setup mode (main before #794) sets up as this workflow did before.
      - id: setup
        name: The repo's test setup from the settings file
        run: |
          if ! (cd /tmp/runtime && python3 -c 'from dokima.settings import setup_lines') 2>/dev/null; then
            echo "::notice title=Old setup::No settings reader with a setup mode here, so the old install list is used."
            printf 'python=3.12\ntest_tools=pytest pytest-xdist pytest-testmon\ninstall=\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          (cd /tmp/runtime && python3 -m dokima.settings setup) > /tmp/setup.txt 2> /tmp/setup-err.txt \
            || { echo "The settings file stopped the run: $(paste -sd' ' /tmp/setup-err.txt)" > /tmp/why.txt
                 echo "::error title=Bad settings::$(cat /tmp/why.txt)"; exit 1; }
          cat /tmp/setup-err.txt >&2; cat /tmp/setup.txt >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup.outputs.python }}
      - name: Install pytest and Claude Code
        env:
          TOOLS: ${{ steps.setup.outputs.test_tools }}
          INSTALL: ${{ steps.setup.outputs.install }}
        run: |
          set -o pipefail
          { pip install $TOOLS pyyaml && python3 -m dokima.agents install "$ROLE" && { [ -z "$INSTALL" ] || eval "$INSTALL"; }; } 2>&1 | tee /tmp/install.txt \
            || { echo "The step 'Install pytest and Claude Code' failed: $(tail -3 /tmp/install.txt | paste -sd' ')" > /tmp/why.txt; exit 1; }
      # The newest testmon baseline recorded on main (testmon.yml), so the review runs only the tests its change can affect.
      # Affected tests set to all in the settings: no baseline is restored and every test runs (#795).
      - name: Restore main's testmon baseline
        if: env.STAGE == 'pr' && env.TESTS_AFFECTED != 'all'
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ github.sha }}
          restore-keys: testmon-
      - name: Tests the change can affect, run by code before the reviewer reads the pull request
        if: env.STAGE == 'pr'
        run: |
          # With a baseline testmon picks the affected tests; with none, or one it cannot read, every test runs, and
          # so with affected tests set to all in the settings (#795).
          code=0; every=
          if [ "$TESTS_AFFECTED" = all ]; then every="affected tests are set to all in the settings"
          elif [ ! -f .testmondata ]; then every="no baseline from main was restored"
          else
            PYTHONPATH= PYTHONSAFEPATH= python3 -m pytest -q -rA --testmon --junitxml="$PACK/tests.xml" > "$PACK/tests.txt" 2>&1 || code=$?
            # Exit 0, 1 (a test failed) and 5 (no test affected) are testmon's real answers; anything else is a crash.
            if [ "$code" -gt 1 ] && [ "$code" -ne 5 ]; then
              echo "::warning title=No usable baseline::testmon stopped with exit $code; running every test"
              every="testmon could not read main's baseline"
            fi
          fi
          if [ -n "$every" ]; then
            # The code review's record reads this note and says every test ran, and why.
            echo "$every" > "$PACK/no-baseline.txt"
            rm -f "$PACK/tests.xml"
            PYTHONPATH= PYTHONSAFEPATH= python3 -m pytest -q -rA --junitxml="$PACK/tests.xml" > "$PACK/tests.txt" 2>&1 || true
          fi
          tail -5 "$PACK/tests.txt"
      - name: Code checks the pack has everything this role needs
        run: |
          python3 -m dokima.agent check-pack "$ROLE" "$STAGE" "$PACK" > /tmp/pack-check.txt \
            || { echo "Incomplete pack: $(paste -sd'; ' /tmp/pack-check.txt)" > /tmp/why.txt
                 echo "::error title=Incomplete pack::$(cat /tmp/why.txt)"; exit 1; }
      # The card says agent working, with a key made for this one edit and revoked before the agent starts.
      - id: working-key
        if: env.CARD_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: The card says working
        if: env.CARD_ID != ''
        env:
          GH_TOKEN: ${{ steps.working-key.outputs.token }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          python3 -m dokima.agent card "$ROLE" "$STAGE" working > /tmp/card.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -F body=@/tmp/card.md --silent \
            || echo "::warning title=Card not updated::the card could not say working"
          gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the card's key could not be revoked"
      - name: The agent starts now
        run: echo "STARTED=true" >> "$GITHUB_ENV"
      # The role's agent, through the one agent interface, with the key from the secret its subscription names.
      - name: The agent (Claude Code)
        env:
          DOKIMA_AGENT_KEY: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
        run: |
          mkdir -p "$OUT"
          case "$ROLE$STAGE" in
            planner)      GRADE=plan-grade;   FILE=plan.json;   CHECK="python3 -m dokima.planner check $N $OUT" ;;
            reviewerplan) GRADE=plan-grade;   FILE=review.json; CHECK="python3 -m dokima.agent check review $OUT/review.json $PACK/plan.json $N" ;;
            reviewerpr)   GRADE=result-grade; FILE=review.json; CHECK="python3 -m dokima.agent check review $OUT/review.json $PACK/plan.json $N" ;;
            worker)       GRADE=result-grade; FILE=work.json;   CHECK="python3 -m dokima.agent check work $OUT/work.json $PACK/plan.json $N" ;;
          esac
          # A hotfix has no plan: `-` in its place checks its hand-back by its shape alone (#863).
          [ "$HOTFIX" != true ] || CHECK="${CHECK/ $PACK\/plan.json / - }"
          CHECK="$CHECK && python3 -m dokima.agent check-round $ROLE $OUT/$FILE $PACK"
          echo "CHECK=$CHECK" >> "$GITHUB_ENV"
          # The shipped prompt with main's settings drawn in, then main's house rules for this role (#796).
          (cd /tmp/runtime && python3 -m dokima.prompt "$ROLE" "$GRADE") > /tmp/shipped.md 2> /tmp/prompt-err.txt \
            && (cd /tmp/runtime && python3 -m dokima.prompt house "$ROLE") > /tmp/house.md 2>> /tmp/prompt-err.txt \
            && (cd /tmp/runtime && python3 -m dokima.hotfix prompt "$([ "$HOTFIX" = true ] && echo on || echo off)" /tmp/shipped.md) 2>> /tmp/prompt-err.txt \
            || { echo "The prompt could not be built: $(paste -sd' ' /tmp/prompt-err.txt)" > /tmp/why.txt
                 echo "::error title=Prompt not built::$(cat /tmp/why.txt)"; exit 1; }
          printf '%s' "$(cat /tmp/shipped.md)

          # Your pack
          - $PACK/issue.md: issue #$N as it stands, with every comment (the owner's words and answers are here).
          - $PACK/in/: every earlier record of this issue, oldest first (NN-role.json). Each holds that run's hand-back,
            the code check's verdict and the run it came from. Answer open blockers by id from the newest review.
          $( [ "$HOTFIX" = true ] && echo "- $PACK/ask.md: the issue's text, the whole ask. This issue is a hotfix: it has no plan." \
            || echo "- $PACK/plan.json: the newest plan that passed its check (absent until the planner has one).")
          - $PACK/open_blockers.json: the open blockers from the newest review at your stage. Answer every one by id.$( [ "$STAGE" = pr ] && echo "
          - $PACK/diff.patch: the work against main. $PACK/tests.txt and tests.xml: the tests the change can affect (every test with no baseline), run by code on this machine.
          - $PACK/worker-run/: the worker's session log." )
          You are on branch try/issue-$N. Your stage is: ${STAGE:-$ROLE}.
          Hand back into $OUT. Before you finish, run this check on your hand-back and fix everything it reports:
            $CHECK$( [ -s /tmp/house.md ] && printf '\n\n# House rules\n%s' "$(cat /tmp/house.md)" )" > /tmp/prompt.md
          python3 -m dokima.agents run "$ROLE" /tmp/prompt.md "$OUT"
      # The card says checking, with a key made for this one edit and revoked before code checks the hand-back.
      - id: checking-key
        if: always() && !cancelled() && env.STARTED == 'true' && env.CARD_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: The card says checking
        if: always() && !cancelled() && env.STARTED == 'true' && env.CARD_ID != ''
        env:
          GH_TOKEN: ${{ steps.checking-key.outputs.token }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          python3 -m dokima.agent card "$ROLE" "$STAGE" checking > /tmp/card.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -F body=@/tmp/card.md --silent \
            || echo "::warning title=Card not updated::the card could not say checking"
          gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the card's key could not be revoked"
      - name: Fence - only in-scope changes, the planner's tests as committed
        if: env.ROLE == 'worker'
        run: |
          # First, so the check runs the planner's tests as committed, on the code that gets pushed (#597).
          # A clashed file still holding conflict markers fails the hand-back, saying which, so nothing is pushed.
          # A hotfix has no plan, so every change it made stays, tests included (#863).
          if ! python3 -m dokima.fence "$BASE" "$([ "$HOTFIX" = true ] && echo - || echo "$PACK/plan.json")" /tmp/clashed.txt > "$OUT/dropped.txt" 2> /tmp/fence-err.txt; then
            cat /tmp/fence-err.txt | tee -a "$OUT/check.txt"; echo "PASSED=false" >> "$GITHUB_ENV"
            echo "::error title=Fence::$(paste -sd' ' /tmp/fence-err.txt)"
          fi
          [ -s "$OUT/dropped.txt" ] && echo "::warning title=Dropped by the fence::$(paste -sd, "$OUT/dropped.txt")" || true
      - name: Code checks the hand-back
        if: always() && env.STARTED == 'true'
        # The agent ran this check itself and cut its texts; here word caps only flag what is still over (#470).
        env:
          STYLE_SOFT: "1"
        run: |
          set +e; bash -c "$CHECK" >> "$OUT/check.txt" 2>&1; rc=$?; set -e
          cat "$OUT/check.txt"
          echo "PASSED=$([ $rc = 0 ] && [ "$PASSED" != false ] && echo true || echo false)" >> "$GITHUB_ENV"
      # The app's token for the result is minted only now, after the agent has finished.
      - id: app
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Push the planner's tests or the worker's code to try/issue-N
        if: env.PASSED == 'true' && env.ROLE != 'reviewer'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          # The planner pushes only the test folder the settings name (Dokima's own, tests, when no settings were read).
          if [ "$ROLE" = planner ]; then git add -- "${TESTS_DIR:-tests}"; else git add -A; fi
          # A planner that merged main in pushes the merge even with no test changed, so the branch holds main.
          if git diff --cached --quiet && { [ "$ROLE" != planner ] || [ "$(git rev-parse HEAD)" = "${BRANCH_TIP:-$(git rev-parse HEAD)}" ]; }; then echo "Nothing to push."
          else
            # The co-author the settings name, if any, is credited on the commit (#796); {bot} is the bot itself (#812).
            CO="${CO_AUTHOR//"{bot}"/${SLUG}[bot] <${BOT_ID}+${SLUG}[bot]@users.noreply.github.com>}"
            CREDIT=(); [ -z "$CO" ] || CREDIT=(--trailer "Co-authored-by: $CO")
            git diff --cached --quiet || git commit -qm "$ROLE for #$N (run ${{ github.run_id }})" "${CREDIT[@]}"
            # The branch may have moved during the run (main merged in): catch up once and push again. Changes that
            # still can't be saved fail the run here, before its record is written, so nothing reports them as done.
            R="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # An open pull request turns draft first, so the push starts no test: its merge gate readies it (#597).
            PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head "try/issue-$N" --state open --json number -q '.[0].number')
            [ -z "$PR" ] || gh pr ready "$PR" -R "$GITHUB_REPOSITORY" --undo \
              || echo "::warning title=Not a draft::pull request #$PR could not be turned draft, so its tests start on this push"
            if ! git push -q "$R" "HEAD:try/issue-$N" \
               && ! { git fetch -q "$R" "try/issue-$N" && git merge -q --no-edit FETCH_HEAD && git push -q "$R" "HEAD:try/issue-$N"; }; then
              echo "The run's changes could not be saved to try/issue-$N, so nothing it did is on the branch." >> "$OUT/check.txt"
              echo "PASSED=false" >> "$GITHUB_ENV"
              echo "::error title=Changes not saved::the run's changes could not be pushed to try/issue-$N"
              exit 0
            fi
          fi
          # A finished worker opens its pull request whether or not it pushed anything (the planner may have pushed it all),
          # as a draft: no test runs on it until its code review approved and the merge gate readies it (#597).
          if [ "$ROLE" = worker ] && [ -z "$(gh pr list -R "$GITHUB_REPOSITORY" --head "try/issue-$N" --state open --json number -q '.[].number')" ]; then
            # A hotfix's pull request carries the hotfix label (#864).
            LABEL=(); [ "$HOTFIX" != true ] || LABEL=(--label "$(cd /tmp/runtime && python3 -m dokima.hotfix label)")
            gh pr create -R "$GITHUB_REPOSITORY" --draft --head "try/issue-$N" --base "$DEFAULT_BRANCH" --title "$(gh issue view "$N" -R "$GITHUB_REPOSITORY" --json title -q .title)" --body "Closes #$N" "${LABEL[@]}"
          fi
      - name: Write this run's record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          if [ "$JOB_STATUS" = cancelled ]; then
            # Someone cancelled the run: its card says so, mentions no one, and nothing starts after it.
            mkdir -p "$OUT"
            python3 -m dokima.agent cancelled "$ROLE" "$STAGE" "$OUT" "${STARTED:-false}" /home/runner/.claude/projects
          elif [ "$STARTED" = true ]; then
            python3 -m dokima.agent record "$ROLE" "$STAGE" "$OUT" "$OUT/check.txt" "${PASSED:-false}" /home/runner/.claude/projects
          else
            # No agent started: a step with no reason of its own is named by GitHub's record of this run.
            mkdir -p "$OUT"
            [ -s /tmp/why.txt ] || gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
              --jq '.jobs[].steps[] | select(.conclusion == "failure") | "The step \(.name) failed."' > /tmp/why.txt || true
            python3 -m dokima.agent not-started "$ROLE" "$STAGE" "$OUT" /tmp/why.txt
          fi
          cat "$OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove secrets from the raw session files before they are uploaded
        if: always()
        env:
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
          SCRUB_GITHUB: ${{ github.token }}
        run: |
          python3 -c "
          import os, dokima.agent as a
          secrets = [v for k, v in os.environ.items() if k.startswith('SCRUB_')]
          for f in a.jsonl_files('/home/runner/.claude/projects'):
              t = open(f).read(); open(f, 'w').write(a.scrub(t, secrets))
          "
      - name: Save the hand-back and the full session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROLE }}-${{ env.N }}
          path: |
            /tmp/dokima-out/
            /home/runner/.claude/projects/
          if-no-files-found: warn
          retention-days: 90
      - name: Save the conversation for good on the records branch, secrets removed
        if: always() && env.STARTED == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          SCRUB_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_GITHUB: ${{ github.token }}
          SCRUB_APP: ${{ steps.app.outputs.token }}
          SCRUB_AGENT: ${{ secrets[env.AGENT_KEY || 'CLAUDE_CODE_OAUTH_TOKEN'] }}
        run: |
          W=/tmp/logs-branch; R="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          B="$RECORDS_BRANCH"
          # Origin is asked with the app's key: on a private repo an anonymous ask fails and would start an orphan (#917).
          # Exit 2 is git's "no such branch"; any other failure is a question origin could not answer, so nothing is saved.
          rc=0; git ls-remote --exit-code --heads "$R" "$B" > /dev/null 2> /tmp/git-err.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then
            echo "::error title=Conversation not saved::could not ask whether $B exists: $(paste -sd' ' /tmp/git-err.txt | sed "s#${GH_TOKEN}#***#g")"; exit 1
          fi
          if [ "$rc" = 0 ]; then git clone -q --depth 1 -b "$B" "$R" "$W"
          else git init -q "$W" && git -C "$W" checkout -q --orphan "$B" && git -C "$W" remote add origin "$R"; fi
          mkdir -p "$W/$(dirname "$LOG")"
          { echo "# ${ROLE}${STAGE:+ ($STAGE)} for #$N"; echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo
            python3 -m dokima.agent transcript /home/runner/.claude/projects "$ROLE"; } > "$W/$LOG"
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git -C "$W" -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" add -A
          git -C "$W" -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" commit -qm "Conversation of run ${{ github.run_id }}"
          for i in 1 2 3; do git -C "$W" push -q origin "HEAD:$B" && break; git -C "$W" -c user.name="${SLUG}[bot]" -c user.email="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" pull -q --rebase origin "$B" || true; done
      # On autopilot, a code review's approval with every check green merges the pull request here, so this step
      # holds the app's key (minted after the agent finished).
      - name: Decide what follows, merge on autopilot, and say it on the card
        id: next
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export OWNERS=$(python3 -m dokima.plan approvers)
          NEXT=$(python3 -m dokima.agent next "$N" "$OUT") || NEXT=stop
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"; echo "$NEXT"
      - name: Post the record as a comment, on the PR once there is one
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # The run's card becomes its record, edited in place; a card that cannot be edited never loses the record.
          # The comment's link goes to OUT/url.txt, so the saved record keeps it.
          if [ -n "$CARD_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -F body=@"$OUT/comment.md" --jq .html_url > "$OUT/url.txt" && exit 0
            echo "::warning title=Card not edited::the record is posted as a new comment"
          fi
          PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head "try/issue-$N" --state open --json number -q '.[0].number')
          if [ -n "$PR" ] && { [ "$ROLE" = worker ] || [ "$STAGE" = pr ]; }; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$OUT/comment.md" > "$OUT/url.txt"
          else
            gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file "$OUT/comment.md" > "$OUT/url.txt"
          fi
      # Each run's record is its own new file on the logs branch, never edited (#610), with the link of the comment it
      # was posted as: later runs read records only from those files. It runs whatever happened, so a failed, cancelled
      # or unstarted run keeps its record too.
      - name: Save this run's record as its own file on the logs branch
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          [ -s "$OUT/record.json" ] || { echo "::error title=Record not saved::this run wrote no record"; exit 1; }
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          export GIT_AUTHOR_NAME="${SLUG}[bot]" GIT_COMMITTER_NAME="${SLUG}[bot]"
          export GIT_AUTHOR_EMAIL="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          python3 -m dokima.agent save-record "$N" "$OUT" || { echo "::error title=Record not saved::the record could not be saved to the logs branch"; exit 1; }
      # An approved plan changes what the plan check reads, but GitHub runs it only on a new commit: code runs it
      # again on the pull request's head, with the app's key (minted after the agent finished), once the record is up.
      - name: Run the plan check again once the plan is approved
        if: always() && !cancelled() && env.ROLE == 'reviewer' && env.STAGE == 'plan' && env.PASSED == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.agent recheck "$N" "$OUT"
      - name: Move the card on the board
        if: always() && vars.DOKIMA_BOARD != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: python3 -m dokima.agent board "$N" "$OUT" || echo "::warning title=Board not moved::the card could not be moved"
      - name: Start the next stage
        if: always() && !cancelled() && startsWith(steps.next.outputs.next, 'start ')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEXT: ${{ steps.next.outputs.next }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: |
          set -- $NEXT
          # On autopilot, one line on the issue where the owner would have typed `/work`.
          if [ -s "$OUT/autopilot.md" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file "$OUT/autopilot.md"; fi
          if [ "$2" = split ]; then
            # An approved split is filed by code, as `/work` files it; its Split filed record is a comment of its own.
            if ! CARD_ID= python3 -m dokima.agent split "$N" 2> /tmp/split-why.txt; then
              # Filing failed: one comment on the issue says why and mentions the owner.
              OWNERS=$(python3 -m dokima.plan approvers | tr ',' '\n' | sed 's/^/@/' | paste -sd' ')
              printf '%s\n' "**Filing the split failed:** $(tail -1 /tmp/split-why.txt)" "" \
                "**Next:** $OWNERS Say \`/work\` to file it again." > /tmp/split-why.md
              gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file /tmp/split-why.md
              exit 1
            fi
            echo "Filed the split of #$N"; exit 0
          fi
          # The next run's queued card goes up now, where its record will go, and its id travels with the signal.
          NEXT_STAGE=$([ "$2" = reviewer ] && echo "${3:-plan}" || true)
          NEXT_CARD=$(python3 -m dokima.agent queue "$2" "$NEXT_STAGE" "$N" handoff) \
            || { NEXT_CARD=; echo "::warning title=No queued card::the next run puts up its own"; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=dokima-next \
            -f "client_payload[role]=$2" -f "client_payload[stage]=${3:-plan}" -f "client_payload[issue]=$N" \
            -f "client_payload[card]=$NEXT_CARD"
          echo "Started the $2${3:+ ($3)} for #$N"
      - name: Fail closed on a bad hand-back or the wrong model
        if: always()
        run: |
          [ "$STARTED" = true ] || { echo "::error title=Not started::$(cat /tmp/why.txt 2>/dev/null)"; exit 1; }
          python3 -c "import json,sys; r=json.load(open('$OUT/record.json')); m=r.get('models') or []; bad=[x for x in m if x!='$MODEL']; sys.exit(print('models:', m) or (1 if bad or not m else 0))"
          [ "$PASSED" = true ] || { echo "::error title=Hand-back rejected::$(paste -sd'; ' "$OUT/check.txt")"; exit 1; }
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  # A run that failed may have died before posting its record (every step after the agent broke). On a fresh machine,
  # code checks: when the run's record is not on the issue or its pull request, its live card becomes a failed record
  # linking the run, mentioning the owner, and the board shows Needs you in the stage's column.
  unrecorded:
    needs: run
    if: always() && needs.run.result == 'failure'
    environment: keys
    runs-on: ubuntu-24.04
    env:
      N: ${{ (inputs.issue || github.event.client_payload.issue) }}
      ROLE: ${{ (inputs.role || github.event.client_payload.role) }}
      STAGE: ${{ (inputs.role || github.event.client_payload.role) == 'reviewer' && (inputs.stage || github.event.client_payload.stage) || '' }}
      OUT: /tmp/dokima-out
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: A failed record for a run that ended before posting its own
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export OWNERS=$(python3 -m dokima.plan approvers)
          python3 -m dokima.agent unrecorded "$ROLE" "$STAGE" "$N" "$OUT"
      # The failed record is saved as its own file too, so later runs read it (#610).
      - name: Save the failed record as its own file on the logs branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          [ -s "$OUT/record.json" ] || exit 0
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          export GIT_AUTHOR_NAME="${SLUG}[bot]" GIT_COMMITTER_NAME="${SLUG}[bot]"
          export GIT_AUTHOR_EMAIL="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          python3 -m dokima.agent save-record "$N" "$OUT"
      - name: The board shows Needs you
        if: vars.DOKIMA_BOARD != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: |
          [ -s "$OUT/record.json" ] || exit 0
          python3 -m dokima.agent board "$N" "$OUT"

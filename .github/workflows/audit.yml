name: audit
# The drift audit (dokima/audit.py): compares the repo's settings with what Dokima needs (dokima/manifest.py) and
# reports anything off on one pinned Setup issue, marked Needs you on the board; a clean repo gets no writes. It runs
# once a day by itself, and whenever the owner presses Run workflow; nothing else starts it. Every audit waits in one
# queue for the repo, shared with no other workflow and never cancelled by a newer run, so two audits never post
# twice. It acts as the Dokima app and reads the board from DOKIMA_BOARD; without the board it fails and says why.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Called by the one workflow an adopter installs (dokima/install/dokima.yml), through entry.yml (#812).
  workflow_call:
    secrets:
      DOKIMA_APP_KEY: {required: true}
      # The agent keys the settings can name; each one set is tried once with its agent (#907).
      CLAUDE_CODE_OAUTH_TOKEN: {required: false}
      CODEX_API_KEY: {required: false}
      KIMI_API_KEY: {required: false}
concurrency:
  group: audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      # Each role's agent, so the audit can try each key once; a failed install shows as a key it could not check.
      - name: Install each role's agent
        run: |
          for role in planner worker reviewer; do
            python3 -m dokima.agents install "$role" || echo "::warning::The $role's agent could not be installed."
          done
      - name: Compare the repo's settings with the manifest and report what is off
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
          DOKIMA_KEY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DOKIMA_KEY_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          DOKIMA_KEY_KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python3 -m dokima.audit "$GITHUB_REPOSITORY"
  upstream:
    # A failed job files its failure in the upstream repo the settings name, naming this workflow and the job, with a
    # key the App's own key mints for that repo's owner; with none set, nothing is filed (#745).
    needs: [audit]
    if: failure()
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .dokima
          persist-credentials: false
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Name the upstream repo's owner
        id: upstream-owner
        run: echo "owner=$(python3 -m dokima.upstream owner)" >> "$GITHUB_OUTPUT"
      - id: upstream-key
        if: steps.upstream-owner.outputs.owner != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          owner: ${{ steps.upstream-owner.outputs.owner }}
      - name: File each failed job upstream
        if: success() || failure()
        env:
          RESULTS: "audit=${{ needs.audit.result }}"
          DOKIMA_UPSTREAM_TOKEN: ${{ steps.upstream-key.outputs.token }}
        run: python3 -m dokima.upstream failed audit

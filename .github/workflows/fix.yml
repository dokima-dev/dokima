name: fix
# Opens an agent's manual fix as a pull request authored by Dokima's app, so the owner can approve it (#589).
# Started by hand on main with the name of the branch the agent pushed. The pull request goes into the default branch
# the settings name, whose branch rule holds it until all tests pass; this workflow never merges it.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch the agent pushed
        required: true
      issue:
        description: The issue this fix fixes; every fix names one, so it is always traceable (file it first if none exists)
        required: true
permissions:
  contents: read
concurrency:
  group: fix-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  open:
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      # The default branch from the settings, the pull request's base (#795).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader
      - name: The default branch from the settings
        run: python3 -m dokima.settings env >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      # A branch whose pull request is already open gets no second one; a refusal from GitHub fails the run.
      - name: Open the fix's pull request as Dokima's app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then echo "::error::A fix comes from the branch the agent pushed, not $DEFAULT_BRANCH"; exit 1; fi
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::A fix names the issue it fixes by number; got '$ISSUE'. File the issue first."; exit 1;; esac
          gh issue view "$ISSUE" --json number >/dev/null || { echo "::error::Issue #$ISSUE does not exist here. File the issue first."; exit 1; }
          open=$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then echo "Pull request #$open is already open for $BRANCH"; exit 0; fi
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "Manual fix: $BRANCH" \
            --body "Fixes #$ISSUE. A manual fix from the branch \`$BRANCH\`, opened by Dokima's app. It merges once all tests pass and the owner approves."

name: Acceptance criteria
# One GitHub check per criterion of the PR's approved plan, plus one gate check.
# Runs main's copy of this workflow and of Dokima's code; only the tests, and the code they judge, come from the PR.
# In the merge queue they come from the queued commit: the PR on top of the latest main.
on:
  pull_request_target:
  merge_group:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  list:
    name: list acceptance criteria
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      # Main's copy of Dokima's code: in the merge queue the default is the queued commit, so name main's branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.merge_group.base_ref }}
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m dokima.checks matrix >> "$GITHUB_OUTPUT"

  check:
    needs: list
    if: needs.list.outputs.matrix != '[]'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Run this criterion's tests
        working-directory: pr
        env:
          TESTS: ${{ matrix.tests }}
          ID: ${{ matrix.id }}
        run: |
          if [ "$ID" = "text-only" ] && [ -z "$TESTS" ]; then echo "::notice title=Text only::Only text files changed: no plan or tests needed."; exit 0; fi
          if [ -z "$TESTS" ]; then echo "::error title=$ID has no test::No test verifies this criterion yet."; exit 1; fi
          pytest -rA -p no:cacheprovider -o junit_family=xunit1 --junitxml=r.xml $TESTS
      - name: Annotate the tests that ran
        if: always() && matrix.tests != ''
        env:
          ID: ${{ matrix.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 -m dokima.checks annotate pr/r.xml

  gate:
    name: Acceptance criteria
    needs: [list, check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          MATRIX: ${{ needs.list.outputs.matrix }}
          RESULT: ${{ needs.check.result }}
        run: |
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "[]" ]; then
            echo "::error title=No acceptance criteria::Link an issue with acceptance criteria (Closes #N) to this pull request."
            exit 1
          fi
          test "$RESULT" = "success"

name: autopilot
run-name: "autopilot after #${{ github.event.issue.number }} ${{ github.event.action }}"
# Autopilot's reaction to an issue closing, usually because its pull request merged. Code reads every issue on
# autopilot from GitHub: a parent whose last sub-issue closed closes too, saying its whole tree is done, and that
# close counts one level up; a done tree (its top issue closed) goes off autopilot; and every issue left on autopilot
# whose blocked-by issues have now all closed starts its planner, with one Autopilot line where the owner would have
# said /plan. Nothing starts twice: an issue with a record, a live card or that line is never started again.
# Every close waits in one queue for the whole repo, which a newer run never cancels, so two merges that close
# together never read the tree at the same moment; and since each run works from the state of every tree, the run
# that goes also does the work of any close whose run GitHub dropped from the queue. A failure says why on the issue.
# A person adding the autopilot label (its name from the repo's settings) by hand switches that one issue on the way `/autopilot start` does: its planner
# starts when nothing open blocks it and nothing started on it yet. A label Dokima's app adds (as `/autopilot start`
# does) starts nothing here, since that command already started what it should.
on:
  issues:
    types: [closed, labeled]
  # A merge queue run that fails takes its pull request out of the queue; code puts it back once, then sends it
  # back to its worker (#830). An adopter's entry.yml calls this on the failed merge_group run itself.
  workflow_run:
    workflows: [full suite, Acceptance criteria]
    types: [completed]
  # Called by the one workflow an adopter installs (dokima/install/dokima.yml), through entry.yml (#812).
  workflow_call:
permissions:
  contents: read
  issues: read
jobs:
  queue-failed:
    # Its own group per queued pull request: never shares the closed job's queue, whose one waiting run a newer
    # event would cancel (#812's lesson).
    concurrency:
      group: queue-failed-${{ github.event.workflow_run.head_branch || github.event.merge_group.head_ref }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group' &&
       github.event.workflow_run.conclusion == 'failure') || github.event_name == 'merge_group'
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Put the pull request back in the queue once, then send it back to its worker
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch || github.event.merge_group.head_ref }}
          FAILED_RUN: ${{ github.event.workflow_run.id || github.run_id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: python3 -m dokima.agent queue-failed
  closed:
    concurrency:
      group: autopilot
      cancel-in-progress: false
    # Any label a person adds wakes it: the autopilot label's name lives in the repo's settings, which code reads (#811).
    if: github.event.action == 'closed' || (github.event.action == 'labeled' && github.event.sender.type != 'Bot')
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Close done parents, switch done trees off, start what the close or the new label unblocked
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: python3 -m dokima.agent "$ACTION" "$N" 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
      - name: Say why autopilot stopped, on the issue that closed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Autopilot could not finish after #%s %s: %s ([run](%s))\n' "$N" "$ACTION" "$(paste -sd' ' /tmp/why.txt 2>/dev/null)" "$RUN" > /tmp/autopilot.md
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file /tmp/autopilot.md
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true

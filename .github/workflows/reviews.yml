name: reviews
# Runs on every review and line note, only so board.yml and card.yml, which run
# after it as main's copy, put the cards where their state says and redraw them. GitHub runs this
# file from the pull request's own copy, so it holds no key and starts nothing.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  heard:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Review or line note on pull request ${{ github.event.pull_request.number }}"

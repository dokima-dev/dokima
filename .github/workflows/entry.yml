name: entry
# The one shared workflow an adopter's thin workflow calls (dokima/install/dokima.yml), at a release tag. It hands each
# event to the shared workflows that act on it, as their own triggers do in Dokima's own repo, so the adopter's file
# stays short (#812). Each runs Dokima's code from Dokima's own repo at this tag, and the adopter's keys from its keys
# environment. In an adopter's repo every shared workflow runs inside the one `dokima` run, so a finished run of it
# stands in for the finished checks and reviews the board and the card wait for; only runs the checks or reviews
# started count, so a redraw never starts another.
# A reusable workflow in another account's repo gets only the secrets it declares and its caller maps by name;
# `secrets: inherit` carries none across (#894). So the jobs below, and the shared workflows' own calls, pass each
# secret by name, only those the called workflow declares (#897).
on:
  workflow_call:
    secrets:
      DOKIMA_APP_KEY: {required: true}
      # The agent keys the settings can name: Claude Code's, and one each for the other shipped agents.
      CLAUDE_CODE_OAUTH_TOKEN: {required: false}
      CODEX_API_KEY: {required: false}
      KIMI_API_KEY: {required: false}
jobs:
  agent:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'dokima-next'
    uses: ./.github/workflows/agent.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}", CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}", CODEX_API_KEY: "${{ secrets.CODEX_API_KEY }}", KIMI_API_KEY: "${{ secrets.KIMI_API_KEY }}"}
    with:
      role: ${{ github.event.client_payload.role }}
      stage: ${{ github.event.client_payload.stage || 'plan' }}
      issue: ${{ github.event.client_payload.issue }}
      card: ${{ github.event.client_payload.card }}
  commands:
    if: >-
      (github.event_name == 'issue_comment' && github.event.action == 'created') ||
      (github.event_name == 'pull_request_review' && github.event.action == 'submitted')
    uses: ./.github/workflows/commands.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}", CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}", CODEX_API_KEY: "${{ secrets.CODEX_API_KEY }}", KIMI_API_KEY: "${{ secrets.KIMI_API_KEY }}"}
  reviews:
    if: github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment'
    uses: ./.github/workflows/reviews.yml
  assign:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: ./.github/workflows/assign.yml
  autopilot:
    if: github.event_name == 'issues' && contains(fromJSON('["closed", "labeled"]'), github.event.action)
    uses: ./.github/workflows/autopilot.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}
  board:
    if: >-
      (github.event_name == 'issues' &&
       contains(fromJSON('["opened", "edited", "labeled", "unlabeled", "closed", "reopened"]'), github.event.action)) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created') ||
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened", "reopened", "synchronize", "closed"]'), github.event.action)) ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
       contains(fromJSON('["pull_request_target", "merge_group", "pull_request_review", "pull_request_review_comment"]'), github.event.workflow_run.event))
    uses: ./.github/workflows/board.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}
  card:
    if: >-
      (github.event_name == 'issues' && github.event.action != 'deleted' && github.event.action != 'transferred') ||
      github.event_name == 'issue_comment' ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened", "edited", "synchronize", "reopened", "closed", "labeled", "unlabeled", "ready_for_review", "converted_to_draft"]'), github.event.action)) ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["pull_request_target", "merge_group", "push", "pull_request_review", "pull_request_review_comment"]'), github.event.workflow_run.event)) ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.event == 'pull_request')
    uses: ./.github/workflows/card.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}
  acceptance-criteria:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action))
    uses: ./.github/workflows/acceptance-criteria.yml
  full-suite:
    # Not on a push to main: the merge queue already ran every test on that exact merge (owner, 2026-10-17).
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action))
    uses: ./.github/workflows/full-suite.yml
  queue-failed:
    # A failed merge queue run: put the pull request back once, then send it back to its worker (#830).
    needs: [acceptance-criteria, full-suite]
    if: >-
      always() && github.event_name == 'merge_group' &&
      (needs.full-suite.result == 'failure' || needs.acceptance-criteria.result == 'failure')
    uses: ./.github/workflows/autopilot.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}
  testmon:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/testmon.yml
    # Its keys file a failure in the upstream repo the settings name (#745).
    secrets: inherit
  uptodate:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/uptodate.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *')
    uses: ./.github/workflows/audit.yml
    secrets: {DOKIMA_APP_KEY: "${{ secrets.DOKIMA_APP_KEY }}"}

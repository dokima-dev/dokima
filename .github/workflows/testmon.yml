name: testmon baseline
# Records which tests each line of main's code touches, so a code review runs only the tests its change can affect.
# Every push to main runs every test with pytest-testmon and saves .testmondata to GitHub's cache; agent.yml restores
# the newest one before a code review's test run. Installs the same packages agent.yml does, so testmon sees the same
# environment and keeps the baseline.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      # The repo's Python, test tools and install command, from its settings file over Dokima's defaults (#794).
      # A checkout whose settings reader has no setup mode (main before #794) sets up as this workflow did before.
      - id: setup
        run: |
          if python3 -c 'from dokima.settings import setup_lines' 2>/dev/null; then out=$(python3 -m dokima.settings setup)
          else out=$(printf 'python=3.12\ntest_tools=pytest pytest-xdist pytest-testmon\ninstall=\n')
            echo "::notice title=Old setup::No settings reader with a setup mode here, so the old install list is used."; fi
          echo "$out"; echo "$out" >> "${GITHUB_OUTPUT:-/dev/null}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup.outputs.python }}
      - name: Install the test tools and the repo itself
        env:
          TOOLS: ${{ steps.setup.outputs.test_tools }}
          INSTALL: ${{ steps.setup.outputs.install }}
        run: |
          pip install -q $TOOLS pyyaml
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
      # Affected tests set to all in the settings: reviews run every test, so main keeps no baseline (#795). A settings
      # reader with no env mode (before #795) keeps the baseline, as before.
      - name: Affected tests from the settings
        run: |
          out=; if python3 -c 'from dokima.settings import env_lines' 2>/dev/null; then out=$(python3 -m dokima.settings env); fi
          if printf '%s\n' "$out" | grep -q '^TESTS_AFFECTED='; then printf '%s\n' "$out" >> "$GITHUB_ENV"
          else echo "TESTS_AFFECTED=testmon" >> "$GITHUB_ENV"; fi
      - if: env.TESTS_AFFECTED == 'all'
        run: echo "::notice title=No baseline::Affected tests are set to all, so no testmon baseline is saved."
      # A failing test still records its baseline (exit 1): testmon runs it again on the next review. Any other
      # non-zero exit is a crash and fails this job, so a missing baseline is never silent. testmon needs pytest's
      # cache plugin, so it is not turned off here.
      - if: env.TESTS_AFFECTED != 'all'
        run: python3 -m pytest -q --testmon || [ $? -eq 1 ]
      - if: env.TESTS_AFFECTED != 'all'
        run: test -s .testmondata || { echo "::error title=No testmon baseline::pytest --testmon wrote no .testmondata"; exit 1; }
      - if: env.TESTS_AFFECTED != 'all'
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ github.sha }}

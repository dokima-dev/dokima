name: testmon baseline
# Records which tests each line of main's code touches, so a code review runs only the tests its change can affect.
# Every push to main runs every test with pytest-testmon and saves .testmondata to GitHub's cache; agent.yml restores
# the newest one before a code review's test run. Installs the same packages agent.yml does, so testmon sees the same
# environment and keeps the baseline.
on:
  push:
    branches: [main]
  # Called by the one workflow an adopter installs (dokima/install/dokima.yml), through entry.yml (#812).
  workflow_call:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      # Only Dokima's own steps run its code: the repo's tests import the repo's own.
      - name: Where Dokima's code is
        run: rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima" && echo "DOKIMA_CODE=$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      # The repo's Python, test tools and install command, from its settings file over Dokima's defaults (#794).
      # A checkout whose settings reader has no setup mode (main before #794) sets up as this workflow did before.
      - id: setup
        run: |
          if PYTHONPATH="$DOKIMA_CODE" PYTHONSAFEPATH=1 python3 -c 'from dokima.settings import setup_lines' 2>/dev/null; then out=$(PYTHONPATH="$DOKIMA_CODE" PYTHONSAFEPATH=1 python3 -m dokima.settings setup)
          else out=$(printf 'python=3.12\ntest_tools=pytest pytest-xdist pytest-testmon\ninstall=\n')
            echo "::notice title=Old setup::No settings reader with a setup mode here, so the old install list is used."; fi
          echo "$out"; echo "$out" >> "${GITHUB_OUTPUT:-/dev/null}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup.outputs.python }}
      - name: Install the test tools and the repo itself
        env:
          TOOLS: ${{ steps.setup.outputs.test_tools }}
          INSTALL: ${{ steps.setup.outputs.install }}
        run: |
          pip install -q $TOOLS pyyaml
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
      # Affected tests set to all in the settings: reviews run every test, so main keeps no baseline (#795). A settings
      # reader with no env mode (before #795) keeps the baseline, as before.
      - name: Affected tests from the settings
        run: |
          out=; if PYTHONPATH="$DOKIMA_CODE" PYTHONSAFEPATH=1 python3 -c 'from dokima.settings import env_lines' 2>/dev/null; then out=$(PYTHONPATH="$DOKIMA_CODE" PYTHONSAFEPATH=1 python3 -m dokima.settings env); fi
          if printf '%s\n' "$out" | grep -q '^TESTS_AFFECTED='; then printf '%s\n' "$out" >> "$GITHUB_ENV"
          else echo "TESTS_AFFECTED=testmon" >> "$GITHUB_ENV"; fi
      - if: env.TESTS_AFFECTED == 'all'
        run: echo "::notice title=No baseline::Affected tests are set to all, so no testmon baseline is saved."
      # A failing test still records its baseline (exit 1): testmon runs it again on the next review. Any other
      # non-zero exit is a crash and fails this job, so a missing baseline is never silent. testmon needs pytest's
      # cache plugin, so it is not turned off here. Only the tests folder the settings name, as the full suite runs:
      # test files elsewhere in the repo may need what the suite never installs (#877). No tests collected (exit 5) is a
      # repo with no tests yet: its baseline is empty, and the run says so (#886).
      - if: env.TESTS_AFFECTED != 'all'
        run: |
          rc=0; python3 -m pytest -q --testmon "${TESTS_DIR:-tests}" || rc=$?
          if [ "$rc" -eq 5 ]; then echo "::notice title=No tests yet::The repo has no tests yet, so the testmon baseline is empty."
          elif [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
      - if: env.TESTS_AFFECTED != 'all'
        run: test -s .testmondata || { echo "::error title=No testmon baseline::pytest --testmon wrote no .testmondata"; exit 1; }
      - if: env.TESTS_AFFECTED != 'all'
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ github.sha }}
  upstream:
    # A failed job files its failure in the upstream repo the settings name, naming this workflow and the job, with a
    # key the App's own key mints for that repo's owner; with none set, nothing is filed (#745).
    needs: [baseline]
    if: failure()
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .dokima
          persist-credentials: false
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ job.workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Name the upstream repo's owner
        id: upstream-owner
        run: echo "owner=$(python3 -m dokima.upstream owner)" >> "$GITHUB_OUTPUT"
      - id: upstream-key
        if: steps.upstream-owner.outputs.owner != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          owner: ${{ steps.upstream-owner.outputs.owner }}
      - name: File each failed job upstream
        if: success() || failure()
        env:
          RESULTS: "baseline=${{ needs.baseline.result }}"
          DOKIMA_UPSTREAM_TOKEN: ${{ steps.upstream-key.outputs.token }}
        run: python3 -m dokima.upstream failed testmon

name: done-whens
# One GitHub check per criterion of the PR's approved plan, plus one gate check.
# Runs main's copy of this workflow and of Dokima's code; only the tests, and the code they judge, come from the PR.
# In the merge queue they come from the queued commit: the PR on top of the latest main.
# The tests run with main's conftest.py files and pytest settings, never the PR's copies.
on:
  pull_request_target:
  merge_group:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  list:
    name: list done-whens
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m dokima.checks matrix >> "$GITHUB_OUTPUT"

  check:
    needs: list
    if: needs.list.outputs.matrix != '[]'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Use main's test setup
        working-directory: pr
        run: |
          setup=(\( -name conftest.py -o -name pytest.ini -o -name .pytest.ini -o -name pytest.toml -o -name .pytest.toml -o -name pyproject.toml -o -name setup.cfg -o -name tox.ini \))
          find . -path ./.git -prune -o \( -type f -o -type l \) "${setup[@]}" -print0 | xargs -0 -r rm -f
          (cd .. && find . -path ./pr -prune -o -path ./.git -prune -o -type f "${setup[@]}" -print0 | xargs -0 -r cp --parents -t pr)
      - name: Run this done-when's tests
        working-directory: pr
        env:
          TESTS: ${{ matrix.tests }}
          ID: ${{ matrix.id }}
        run: |
          if [ "$ID" = "text-only" ] && [ -z "$TESTS" ]; then echo "::notice title=Text only::Only text files changed: no plan or tests needed."; exit 0; fi
          if [ -z "$TESTS" ]; then echo "::error title=$ID has no test::No test verifies this done-when yet."; exit 1; fi
          pytest -rA -p no:cacheprovider -o junit_family=xunit1 --junitxml=r.xml $TESTS
      - name: Annotate the tests that ran
        if: always() && matrix.tests != ''
        env:
          ID: ${{ matrix.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 -m dokima.checks annotate pr/r.xml

  gate:
    name: all done-whens passed
    needs: [list, check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          MATRIX: ${{ needs.list.outputs.matrix }}
          RESULT: ${{ needs.check.result }}
        run: |
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "[]" ]; then
            echo "::error title=No done-whens::Link an issue with done-whens (Closes #N) to this pull request."
            exit 1
          fi
          test "$RESULT" = "success"

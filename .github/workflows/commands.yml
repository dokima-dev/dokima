name: commands
run-name: "${{ github.event.comment.body }}"
# The listener. A code owner's comment whose first line starts with /plan, /work or /review starts that stage, on the
# issue or on its pull request, and so does a PR review submitted as a comment or a change request. An Approve never
# starts anything: it only ever means merge. Everything after the command, and every other comment, review and line
# note, reaches the agent through its pack. No command, nothing starts; bots never start anything. On an issue
# /review grades the plan; on a pull request, the work. A code owner's command that fails here, before any agent
# starts, gets one record where it was written with GitHub's error, and the owner is mentioned. Every code owner's
# command first puts up one card for its run, which becomes that run's record. A code owner's `/autopilot start` or
# `/autopilot stop` starts no stage: it switches the issue's whole tree (or the tree of the issue a pull request was
# built for) on or off autopilot, the `autopilot` label, and says which issues it switched where it was written. On
# `/autopilot start`, an approved plan of that issue still waiting for `/work` starts the worker, and an approved split
# not yet filed is filed, each with one Autopilot line on the issue.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Called by the one workflow an adopter installs (dokima/install/dokima.yml), through entry.yml (#812).
  workflow_call:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  route:
    if: >-
      (github.event.comment.user.type || github.event.review.user.type) == 'User' &&
      startsWith(github.event.comment.body || github.event.review.body, '/') &&
      github.event.review.state != 'approved' 
    runs-on: ubuntu-24.04
    outputs:
      role: ${{ steps.r.outputs.role }}
      stage: ${{ steps.r.outputs.stage }}
      issue: ${{ steps.r.outputs.issue }}
      autopilot: ${{ steps.r.outputs.autopilot }}
      why: ${{ steps.why.outputs.why }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ github.job_workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - id: r
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          ON_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SENDER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER" || { echo "::notice::$SENDER is not a code owner."; exit 0; }
          python3 -m dokima.agent route > /tmp/route.txt 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
          cat /tmp/route.txt
          # /work on an approved split files its stories; no worker runs.
          if grep -qx "role=worker" /tmp/route.txt; then
            N=$(sed -n 's/^issue=//p' /tmp/route.txt)
            KIND=$(python3 -m dokima.agent kind "$N" 2> /tmp/why.txt) || { cat /tmp/why.txt >&2; exit 1; }
            [ "$KIND" = feature ] && sed -i 's/^role=worker$/role=split/' /tmp/route.txt
          fi
          cat /tmp/route.txt >> "$GITHUB_OUTPUT"
      - id: why
        if: failure()
        run: echo "why=$(paste -sd' ' /tmp/why.txt)" >> "$GITHUB_OUTPUT"
  # A code owner's command puts up its run's card within seconds, where the record will go: queued, or waiting for
  # the run still going on the issue. The run, or filing the split, edits this one card into its record.
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  queue:
    needs: route
    if: needs.route.outputs.role != ''
    environment: keys
    runs-on: ubuntu-24.04
    outputs:
      card: ${{ steps.card.outputs.card }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ github.job_workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - id: card
        name: Put up the run's queued card
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROLE: ${{ needs.route.outputs.role }}
          STAGE: ${{ needs.route.outputs.stage }}
          N: ${{ needs.route.outputs.issue }}
        run: |
          if ID=$(python3 -m dokima.agent queue "$ROLE" "$STAGE" "$N"); then
            echo "card=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No queued card::the card could not be put up; the run puts up its own"
          fi
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  split:
    needs: [route, queue]
    if: always() && needs.route.result == 'success' && needs.route.outputs.role == 'split'
    environment: keys
    runs-on: ubuntu-24.04
    outputs:
      why: ${{ steps.why.outputs.why }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ github.job_workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: File the approved split's stories as sub-issues
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
          CARD_ID: ${{ needs.queue.outputs.card }}
        run: |
          python3 -m dokima.agent split "${{ needs.route.outputs.issue }}" 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
      - id: why
        if: failure()
        run: echo "why=$(paste -sd' ' /tmp/why.txt)" >> "$GITHUB_OUTPUT"
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  autopilot:
    needs: route
    if: needs.route.outputs.autopilot != ''
    environment: keys
    runs-on: ubuntu-24.04
    outputs:
      why: ${{ steps.why.outputs.why }}
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ github.job_workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Switch the issue tree on or off autopilot, and say which issues, where it was written
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SWITCH: ${{ needs.route.outputs.autopilot }}
          N: ${{ needs.route.outputs.issue }}
          ON_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: |
          export OWNERS=$(python3 -m dokima.plan approvers)
          python3 -m dokima.agent autopilot "$SWITCH" "$N" /tmp/pickup > /tmp/autopilot.md 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
          if [ "$ON_PR" = true ]; then
            gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file /tmp/autopilot.md
          else
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file /tmp/autopilot.md
          fi
          # What was waiting for `/work` goes on now, with one Autopilot line on the issue in place of the command.
          [ -s /tmp/pickup/autopilot.md ] || exit 0
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file /tmp/pickup/autopilot.md
          if [ "$(cat /tmp/pickup/next.txt)" = split ]; then
            python3 -m dokima.agent split "$N" 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
          else
            CARD=$(python3 -m dokima.agent queue worker "" "$N" handoff) \
              || { CARD=; echo "::warning title=No queued card::the worker puts up its own"; }
            gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=dokima-next \
              -f "client_payload[role]=worker" -f "client_payload[stage]=plan" -f "client_payload[issue]=$N" \
              -f "client_payload[card]=$CARD" 2> /tmp/why.txt || { cat /tmp/why.txt >&2; exit 1; }
          fi
      - id: why
        if: failure()
        run: echo "why=$(paste -sd' ' /tmp/why.txt)" >> "$GITHUB_OUTPUT"
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  say-why:
    needs: [route, queue, split, autopilot]
    if: always() && (needs.route.result == 'failure' || needs.split.result == 'failure' || needs.autopilot.result == 'failure')
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      - name: Count this run's GitHub calls
        continue-on-error: true
        # Every gh call this job makes goes through a counter, so its cost in GitHub's hourly budget is known (#426).
        run: |
          d="$RUNNER_TEMP/ghcount" && mkdir -p "$d" && real=$(command -v gh)
          printf '#!/bin/sh\necho "$*" | cut -c1-120 >> %s/calls\nexec %s "$@"\n' "$d" "$real" > "$d/gh"
          chmod +x "$d/gh" && { [ -z "$GITHUB_PATH" ] || echo "$d" >> "$GITHUB_PATH"; } || true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dokima's code from Dokima's own repo, at this shared workflow's commit (main when run directly), never the
      # repo's own copy (#812).
      - name: Dokima's code from Dokima's own repo
        uses: actions/checkout@v5
        with:
          repository: dokima-dev/dokima
          ref: ${{ github.job_workflow_sha }}
          path: .dokima-code
          sparse-checkout: dokima
          persist-credentials: false
      - name: Every Dokima step runs Dokima's code
        run: |
          rm -rf "$RUNNER_TEMP/dokima" && mv .dokima-code "$RUNNER_TEMP/dokima"
          printf 'PYTHONPATH=%s\nPYTHONSAFEPATH=1\n' "$RUNNER_TEMP/dokima" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - run: python3 -m pip install -q pyyaml  # the settings reader (#794)
      - name: Say why the command started nothing, where it was written
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WHY: ${{ needs.route.outputs.why || needs.split.outputs.why || needs.autopilot.outputs.why }}
          ROLE: ${{ needs.route.outputs.role }}
          STAGE: ${{ needs.route.outputs.stage }}
          ON_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          CARD_ID: ${{ needs.queue.outputs.card }}
        run: |
          # With GitHub's hourly request budget spent, nothing that reads the issue can run, so say so with the calls
          # that still work, and when to try again (#368). Asking how much is left costs nothing.
          read -r gq gq_reset core core_reset <<< "$(gh api rate_limit --jq '[.resources.graphql.remaining, .resources.graphql.reset, .resources.core.remaining, .resources.core.reset] | @tsv' 2>/dev/null || true)"
          if [ "${gq:-1}" = 0 ] || [ "${core:-1}" = 0 ]; then
            reset=$([ "${gq:-1}" = 0 ] && echo "$gq_reset" || echo "$core_reset")
            msg="Nothing ran: Dokima used up GitHub's hourly request budget. It refills at $(date -u -d "@$reset" +%H:%M) UTC; give the command again then."
            echo "::error title=Request budget used up::$msg"
            [ -n "$CARD_ID" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -f body="$msg" --silent && exit 0
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$msg" --silent
            exit 0
          fi
          export OWNERS=$(python3 -m dokima.plan approvers)
          mkdir -p /tmp/out && printf '%s\n' "$WHY" > /tmp/why.txt
          python3 -m dokima.agent not-started "$ROLE" "$STAGE" /tmp/out /tmp/why.txt
          python3 -m dokima.agent next "$NUMBER" /tmp/out
          # The command's queued card becomes the record of why; a card that cannot be edited never loses it.
          if [ -n "$CARD_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CARD_ID" -F body=@/tmp/out/comment.md --silent && exit 0
            echo "::warning title=Card not edited::the record is posted as a new comment"
          fi
          if [ "$ON_PR" = true ]; then
            gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file /tmp/out/comment.md
          else
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file /tmp/out/comment.md
          fi
      - name: Report this run's GitHub calls
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ghcount" 2>/dev/null && [ -s calls ] || { echo "::notice title=GitHub calls::none"; exit 0; }
          awk '{ k = ($1 == "api") ? (($2 == "graphql") ? "graphql" : "rest") : ($1 ~ /^(run|workflow|release|secret|variable|cache)$/ ? "rest" : "graphql")
                 n[k]++; t[$1 " " (($1 == "api" && $2 != "graphql") ? "rest" : $2)]++ }
               END { for (x in t) print t[x], x | "sort -rn | head -4 | paste -sd, - > top"; close("sort -rn | head -4 | paste -sd, - > top")
                     getline top < "top"
                     printf "::notice title=GitHub calls::graphql %d, rest %d; most: %s\n", n["graphql"], n["rest"], top }' calls || true
  run:
    needs: [route, queue]
    if: always() && needs.route.result == 'success' && needs.route.outputs.role != '' && needs.route.outputs.role != 'split'
    uses: ./.github/workflows/agent.yml
    secrets: inherit
    with:
      role: ${{ needs.route.outputs.role }}
      stage: ${{ needs.route.outputs.stage }}
      issue: ${{ needs.route.outputs.issue }}
      card: ${{ needs.queue.outputs.card }}
